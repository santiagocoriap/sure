# Build the Docker image in GitHub Actions and push it to this fork's GitHub
# Container Registry (GHCR), so your VPS never has to build it — Coolify just
# pulls the finished image.
#
# Image:  ghcr.io/<owner>/<repo>  (e.g. ghcr.io/santiagocoriap/sure)
# Tags:   the branch name (e.g. `installments-integration`), a short commit SHA,
#         and `latest` for pushes to `main`.
#
# Coolify pulls the BRANCH tag (see docker-compose.coolify.yml -> APP_IMAGE), so
# only pushing the branch you deploy updates what production runs.
#
# Optional auto-deploy: add repo secrets COOLIFY_WEBHOOK (the deploy URL from
# Coolify) and, if needed, COOLIFY_TOKEN — the last step will ping Coolify to
# pull + redeploy after each successful build.

name: Build & push image (Coolify)

on:
  push:
    branches:
      - main
      - installments-integration
    paths-ignore:
      - "charts/**"
      - "mobile/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    # Exposed so the optional deploy step can check whether it's configured.
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Most VPSes are x86_64. If yours is ARM, change to linux/arm64
          # (or add both, which roughly doubles build time).
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy (optional)
        if: ${{ env.COOLIFY_WEBHOOK != '' }}
        run: |
          echo "Pinging Coolify to pull the new image and redeploy..."
          curl --fail-with-body --silent --show-error -X GET "${COOLIFY_WEBHOOK}" \
            ${COOLIFY_TOKEN:+-H "Authorization: Bearer ${COOLIFY_TOKEN}"}
